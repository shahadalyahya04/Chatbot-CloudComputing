name: Build and deploy to Azure VM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-vm-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dockerfile: Dockerfile.backend
            image: chatbot-backend
          - dockerfile: Dockerfile.chatbot
            image: chatbot-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Update the application on the VM
        env:
          RESOURCE_GROUP_NAME: ${{ secrets.RESOURCE_GROUP_NAME }}
          VM_NAME: ${{ secrets.VM_NAME }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          cat > /tmp/deploy.sh <<EOF
          set -eu
          runuser -u azureuser -- bash /home/azureuser/chatbot-project-CloudComputing/update_app.sh "$COMMIT_SHA"
          echo STAGE7_DEPLOY_SUCCESS
          EOF
          az vm run-command invoke \
            --resource-group "$RESOURCE_GROUP_NAME" \
            --name "$VM_NAME" \
            --command-id RunShellScript \
            --scripts @/tmp/deploy.sh \
            --output json > /tmp/deploy-result.json
          cat /tmp/deploy-result.json
          python - <<'PY'
          import json
          with open('/tmp/deploy-result.json') as f:
              result = json.load(f)
          assert any('STAGE7_DEPLOY_SUCCESS' in item.get('message', '') for item in result.get('value', [])), 'VM deployment failed'
          PY
